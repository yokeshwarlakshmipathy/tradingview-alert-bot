<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Video Resumes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="admin-container">
        <header class="header">
            <h1>Nohitatu Technologies</h1>
            <h2>Video Resume Admin Dashboard</h2>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <h3>Total Submissions</h3>
                <p class="stat-number" id="totalSubmissions">0</p>
            </div>
            <div class="stat-card">
                <h3>Latest Submission</h3>
                <p class="stat-text" id="latestSubmission">-</p>
            </div>
        </div>

        <div class="controls-section">
            <button id="refreshBtn" class="btn btn-primary">🔄 Refresh</button>
            <input type="text" id="searchInput" placeholder="Search by name or email..." class="search-input">
        </div>

        <div class="table-container">
            <table class="candidates-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Submission Date</th>
                        <th>Video Info</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="candidatesTableBody">
                    <tr>
                        <td colspan="7" class="loading">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="adminStatusMessage" class="status-message"></div>
    </div>

    <!-- Video Preview Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalCandidateName"></h2>
            <div id="videoContainer"></div>
            <div id="candidateDetails"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
